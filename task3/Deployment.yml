apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-web
  namespace: qa
  labels:
    app: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qa
  template:
    metadata:
      labels:
        app: qa
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80

