apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: sql
        image: mysql:5.7
        envFrom:
        - secretRef:
            name: db-secret 
        ports:
        - containerPort: 80

